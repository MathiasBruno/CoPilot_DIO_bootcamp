<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTravel - Simulador de Impacto</title>
    <style>
        :root {
            --primary: #2ecc71;
            --dark: #27ae60;
            --bg: #f0f2f5;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: var(--text);
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: var(--dark);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box; /* Garante que padding não estoure a largura */
        }

        select:focus, input:focus {
            border-color: var(--primary);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--dark);
        }

        #resultado {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f8f5;
            border-left: 5px solid var(--primary);
            border-radius: 4px;
            display: none; /* Escondido por padrão */
        }

        .res-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--dark);
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>🌱 Simulador EcoTravel</h2>
        
        <div class="form-group">
            <label for="transporte">Meio de Transporte:</label>
            <select id="transporte">
                <option value="bicicleta">🚲 Bicicleta</option>
                <option value="onibus">🚌 Ônibus</option>
                <option value="moto">🏍️ Moto</option>
                <option value="carro">🚗 Carro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="distancia">Distância Percorrida (km):</label>
            <input type="number" id="distancia" placeholder="Ex: 15.5" step="0.1" min="0">
        </div>

        <button onclick="calcularImpacto()">Calcular Impacto</button>

		<div id="resultado">
		    <p>Emissão Total: <br><span class="res-value" id="res-co2">0</span> kg de CO₂</p>
		    <p>Créditos Necessários: <br><span class="res-value" id="res-creditos">0</span> créditos</p>
		    
		    <hr style="border-color: #2ecc71; opacity: 0.3;">
		    <p>Custo para Compensar: <br><span class="res-value" id="res-custo" style="color: #27ae60;">R$ 0,00</span></p>
		</div>
    </div>

    <script>
        async function calcularImpacto() {
            const transporte = document.getElementById('transporte').value;
            const distancia = document.getElementById('distancia').value;
            const resultadoDiv = document.getElementById('resultado');

            if (!distancia || distancia <= 0) {
                alert("Por favor, insira uma distância válida.");
                return;
            }

            // Preparar dados para o Java
            const dados = {
                transporte: transporte,
                distancia: parseFloat(distancia)
            };

            try {
                // Chamada ao Back-end Java
                const response = await fetch('http://localhost:8080/api/calcular', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(dados)
                });

                if (!response.ok) throw new Error('Erro na conexão com o servidor');

				const data = await response.json();

				// Atualizar a tela
				document.getElementById('res-co2').innerText = data.co2EmitidoKg.toFixed(2);
				document.getElementById('res-creditos').innerText = data.creditosCarbono.toFixed(5);

				// Lógica Nova: Formatar e exibir o dinheiro
				const valorFormatado = new Intl.NumberFormat('pt-BR', {
				    style: 'currency',
				    currency: 'BRL'
				}).format(data.custoEstimadoReais);

				document.getElementById('res-custo').innerText = valorFormatado;

				resultadoDiv.style.display = 'block';

            } catch (error) {
                console.error(error);
                alert("Erro ao conectar com o servidor Java. Verifique se ele está rodando.");
            }
        }
    </script>
</body>
</html>
